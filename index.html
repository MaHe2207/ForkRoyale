.celebration-food{font-size:clamp(21px,4vw,37px);font-weight:900;line-height:1.2;margin-top:23px;max-width:80vw;text-shadow:0 3px 16px #18000c;letter-spacing:-.035em}
.super-burst{font-size:clamp(125px,31vmin,300px);line-height:1;filter:drop-shadow(0 0 25px #fffcb2);animation:heartBounce .35s ease-in-out infinite alternate;transform-origin:center bottom;margin-bottom:10px}

@keyframes celebrationIn{from{opacity:0;transform:scale(1.07);filter:brightness(2)}to{opacity:1;transform:scale(1);filter:brightness(1)}}

@keyframes centerPop{from{opacity:0;transform:scale(.58) rotate(-9deg)}to{opacity:1;transform:scale(1) rotate(0)}}

<script>
(()=>{
'use strict';
const VERSION='1.0.4', STORE='fork_royale_local_v1', DAY=86400000, GRACE=10*DAY;
const icons={arena:'🥊',hot:'♥',matches:'♡',week:'▦',foods:'▤',history:'◷',settings:'⚙'};
const photoUrls={pizza:'https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=650&q=80',burger:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=650&q=80',pasta:'https://images.unsplash.com/photo-1551183053-bf91a1d81141?w=650&q=80',salad:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=650&q=80',ramen:'https://images.unsplash.com/photo-1569718212165-3a8278d5f624?w=650&q=80',bowl:'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=650&q=80',pancake:'https://images.unsplash.com/photo-1528207776546-365bb710ee93?w=650&q=80',tacos:'https://images.unsplash.com/photo-1551504734-5ee1c4a1479b?w=650&q=80',steak:'https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=650&q=80',sushi:'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=650&q=80',cake:'https://images.unsplash.com/photo-1565958011703-44f9829ba187?w=650&q=80',curry:'https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=650&q=80'};
const seedNames=[
 ['Pizza Margherita','Pizza,Italienisch,Vegetarisch','🍕','pizza'],['Ramen','Asiatisch,Suppe,Warm','🍜','ramen'],['Sushi','Japanisch,Fisch','🍣','sushi'],['Lasagne','Pasta,Italienisch,Warm','🍝','pasta'],['Pad Thai','Asiatisch,Nudeln','🍜','bowl'],['Cheeseburger','Fast Food,Fleisch','🍔','burger'],['Spaghetti Bolognese','Pasta,Italienisch','🍝','pasta'],['Gemüsecurry','Vegetarisch,Asiatisch','🍛','curry'],['Ofenkartoffeln','Vegetarisch,Ofengericht','🥔','bowl'],['Tacos','Mexikanisch,Schnell','🌮','tacos'],['Caesar Salad','Salat,Leicht','🥗','salad'],['Risotto','Italienisch,Reis','🍚','bowl'],['Flammkuchen','Ofengericht,Knusprig','🥓','pizza'],['Gnocchi','Pasta,Vegetarisch','🥟','pasta'],['Falafel-Bowl','Vegetarisch,Orientalisch','🥙','bowl'],['Chicken Teriyaki','Asiatisch,Huhn','🍗','curry'],['Käsespätzle','Deutsch,Käse','🧀','pasta'],['Burrito','Mexikanisch,Reis','🌯','tacos'],['Linsensuppe','Suppe,Vegetarisch','🥣','bowl'],['Pesto Pasta','Pasta,Schnell','🍝','pasta'],['Tomatensuppe','Suppe,Vegetarisch','🍅','bowl'],['Couscous-Salat','Salat,Leicht','🥗','salad'],['Wraps','Schnell,Snack','🌯','tacos'],['Kartoffelgratin','Ofengericht,Käse','🥔','bowl'],['Pancakes','Frühstück,Süß','🥞','pancake'],['Chili sin Carne','Vegetarisch,Scharf','🌶️','curry'],['Maultaschen','Deutsch,Warm','🥟','pasta'],['Lachs mit Reis','Fisch,Reis','🍣','sushi'],['Steak mit Gemüse','Fleisch,Deftig','🥩','steak'],['Quiche','Ofengericht,Vegetarisch','🥧','pizza']];
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const WEEK_DAYS=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
function localDate(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function fromISO(s){return new Date(s+'T12:00:00')}
function shiftDate(s,days){const d=fromISO(s);d.setDate(d.getDate()+days);return localDate(d)}
function monday(s){const d=fromISO(s);const delta=(d.getDay()+6)%7;d.setDate(d.getDate()-delta);return localDate(d)}
function fmt(s,opt){return fromISO(s).toLocaleDateString('de-DE',opt||{day:'2-digit',month:'short',year:'numeric'})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){const foods=seedNames.map((a,i)=>({id:'f'+i,name:a[0],tags:a[1].split(','),emoji:a[2],image:photoUrls[a[3]]||'',createdAt:Date.now()-DAY*(28-i)}));const ids=foods.map(f=>f.id);const rotated=[...ids.slice(7),...ids.slice(0,7)];const today=localDate(), thisMon=monday(today);return {foods,ranks:{a:[...ids],b:rotated},votes:{f0:{a:{v:'hot',at:Date.now()-DAY},b:{v:'hot',at:Date.now()-DAY}},f1:{a:{v:'super',at:Date.now()-DAY}},f2:{a:{v:'hot',at:Date.now()-DAY*2},b:{v:'hot',at:Date.now()-DAY}},f4:{a:{v:'hot',at:Date.now()-DAY},b:{v:'not',at:Date.now()-DAY}},f3:{a:{v:'hot',at:Date.now()-DAY*3},b:{v:'hot',at:Date.now()-DAY*3}}},plan:[{id:'pinit',foodId:'f3',day:3}],history:[{id:'h1',foodId:'f6',name:'Spaghetti Bolognese',emoji:'🍝',tags:['Pasta','Italienisch'],date:shiftDate(today,-2)},{id:'h2',foodId:'f7',name:'Gemüsecurry',emoji:'🍛',tags:['Vegetarisch','Asiatisch'],date:shiftDate(today,-5)}],outAt:{},duels:{a:12,b:6},prefs:{topN:20,radius:10},names:{a:'Person 1',b:'Person 2'},active:'a',lastPool:[],priority:{a:[],b:[]},notifications:{a:[],b:[]}}}
let db;try{db=JSON.parse(localStorage.getItem(STORE)||localStorage.getItem('foodfight_mockup_v08')||localStorage.getItem('foodfight_mockup_v07'));if(!db||!Array.isArray(db.foods)||!db.ranks)throw Error('Invalid')}catch(e){db=seed()}
// v0.7 stored dated plans. Convert them once to a timeless Monday–Sunday plan.
db.plan=(db.plan||[]).map(entry=>{const {date,...rest}=entry;const day=Number.isInteger(entry.day)?entry.day:(entry.date?(fromISO(entry.date).getDay()+6)%7:0);return {...rest,day:Math.max(0,Math.min(6,day))}});
db.notifications??={a:[],b:[]};db.notifications.a??=[];db.notifications.b??=[];
let ui={tab:'arena',hotCurrent:{a:null,b:null},hotBag:{a:[],b:[]},hotLast:{a:null,b:null},duel:{a:null,b:null},modal:null,more:false,search:'',historySearch:'',tag:'Alle'};
const CLOUD_ON=!!(window.FORK_CONFIG?.firebase?.apiKey&&window.FORK_CONFIG?.uids?.a&&window.FORK_CONFIG?.uids?.b);
let cloud=null,cloudReady=false,cloudRole=null,cloudPending=0,cloudDeferred=null;
let cloudBaseline=null,cloudChain=Promise.resolve(),suppressStore=false,syncLabel='Lokal';
let deferredInstall=null;
const clone=v=>JSON.parse(JSON.stringify(v));
function cloudData(state=db){const x=clone(state);delete x.active;delete x.lastPool;delete x.priority;return x}
function emptyState(){const s=seed();s.foods=[];s.ranks={a:[],b:[]};s.votes={};s.plan=[];s.history=[];s.outAt={};s.duels={a:0,b:0};s.notifications={a:[],b:[]};return cloudData(s)}
function applyCloudState(raw){
  if(cloudPending){cloudDeferred=raw;return}
  const wasReady=cloudReady,prev=wasReady?pool():[],oldPriority=db.priority||{a:[],b:[]};
  db={...emptyState(),...clone(raw),active:cloudRole,priority:oldPriority,lastPool:[]};
  db.priority.a??=[];db.priority.b??=[];db.notifications??={a:[],b:[]};
  db.notifications.a??=[];db.notifications.b??=[];
  cloudBaseline=cloudData(db);cloudReady=true;syncLabel='Verbunden';
  suppressStore=true;
  reconcile(prev,!wasReady);
  suppressStore=false;
  paintLogin('ready');render();
}
function store(){
  if(suppressStore)return;
  if(CLOUD_ON){
    if(!cloudReady||!cloud)return;
    const before=cloudBaseline,after=cloudData(db);
    if(JSON.stringify(before)===JSON.stringify(after))return;
    cloudBaseline=clone(after);cloudPending++;syncLabel='Synchronisiert …';
    cloudChain=cloudChain.then(()=>cloud.patch(before,after)).then(result=>{cloudDeferred=result}).catch(err=>{
      syncLabel='Synchronisierungsfehler';toast('Änderung nicht synchronisiert: '+(err?.message||err));
      cloudDeferred=null;cloud.reload().catch(()=>{});
    }).finally(()=>{
      cloudPending--;
      if(!cloudPending&&cloudDeferred){const pending=cloudDeferred;cloudDeferred=null;applyCloudState(pending)}
    });
    return;
  }
  try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){if(e?.name==='QuotaExceededError')toast('Speicherplatz erschöpft. Bitte kleinere Bilder verwenden.')}
}
function paintLogin(status,msg=''){
  const root=document.getElementById('login-root');if(!CLOUD_ON||status==='ready'){root.innerHTML='';return}
  const showForm=status==='login'||status==='error';
  const message= status==='denied'?'Dieses Firebase-Konto gehört nicht zu den zwei freigeschalteten Personen.':
    status==='loading'?'Der gemeinsame Datenraum wird geladen …':msg||'Melde dich mit deinem eigenen Fork-Royale-Konto an.';
  root.innerHTML=`<div class="login-screen"><div class="login-panel"><img src="./logo-full.png" alt="Fork Royale Logo"/><h1>Fork Royale</h1><p>${esc(message)}</p>${showForm?`<form id="login-form"><div class="field"><label for="email">E-Mail</label><input class="input" id="email" type="email" autocomplete="username" required/></div><div class="field"><label for="password">Passwort</label><input class="input" id="password" type="password" autocomplete="current-password" required/></div><button class="btn primary" type="submit">Anmelden</button></form>`:status==='denied'?`<button class="btn ghost" data-action="signout">Anderes Konto anmelden</button>`:'<p>Verbindung wird hergestellt.</p>'}</div></div>`;
}
function isInstalledPWA(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}
// Web Install API (newer browsers), with Chromium's beforeinstallprompt as fallback.
// Browsers never let a website install an application without their own confirmation UI.
function supportsDirectInstall(){return typeof navigator.install==='function'||!!deferredInstall}
function installInstructions(){
 const ua=navigator.userAgent;
 const android=/Android/i.test(ua), ios=/iPhone|iPad|iPod/i.test(ua);
 const inApp=/FBAN|FBAV|Instagram|TikTok|Snapchat|WhatsApp/i.test(ua);
 if(isInstalledPWA())return '<p><strong>Fork Royale läuft bereits als installierte App.</strong></p>';
 if(ios)return '<p>Auf iOS ist kein automatischer Installationsdialog für Webseiten verfügbar. Öffne Fork Royale in Safari und wähle <strong>Teilen → Zum Home-Bildschirm</strong>.</p>';
 if(android){
  if(inApp)return '<p>Die Seite scheint in einem integrierten App-Browser geöffnet zu sein. Dort steht die Android-PWA-Installation meist nicht zur Verfügung. Öffne <strong>Fork Royale direkt in Chrome</strong>.</p>';
  return '<p>Der Button startet den <strong>echten Android-Installationsdialog</strong>, sobald Chrome die App dafür freigibt. Ist er noch nicht verfügbar, zeigt die Diagnose darunter die überprüfbaren Voraussetzungen. Chrome benötigt gegebenenfalls eine Interaktion mit der App und etwas Nutzungszeit.</p>';
 }
 return '<p>Wenn der Browser die App als installierbar erkennt, öffnet der Button dessen nativen Installationsdialog. Die Diagnose zeigt die technischen Voraussetzungen.</p>';
}
function showInstallHelp(reason=''){
 ui.modal={type:'install',reason};renderModal();void checkInstallRequirements();
}
async function checkInstallRequirements(){
 const root=document.getElementById('install-diagnostics');if(!root)return;
 const rows=[];
 const append=(ok,description)=>rows.push(`<div>${ok?'✓':'✕'} ${esc(description)}</div>`);
 const secure=window.isSecureContext;
 append(secure,'HTTPS / sicherer Kontext: '+(secure?'OK':'nicht verfügbar'));
 try{
  const response=await fetch('./manifest.json?v=1.0.3',{cache:'no-store'});
  if(!response.ok)throw Error('HTTP '+response.status);
  const type=response.headers.get('content-type')||'ohne MIME';
  const data=await response.json();
  const expected=new URL('./',location.href).pathname;
  const valid=Boolean(data.name && data.start_url && data.id && data.display==='standalone' && new URL(data.start_url,response.url).pathname===expected && new URL(data.id,response.url).pathname===expected);
  append(valid,'App-Manifest: '+(valid?'OK':'ungültige Angaben')+' ('+type+')');
  if(Array.isArray(data.icons)){
   for(const size of [192,512]){
    const icon=data.icons.find(x=>x.sizes===size+'x'+size);
    if(!icon){append(false,'App-Icon '+size+'px fehlt im Manifest');continue}
    try{const iconUrl=new URL(icon.src,response.url);const r=await fetch(iconUrl,{cache:'no-store'});append(r.ok,'App-Icon '+size+'px: '+(r.ok?'OK':'HTTP '+r.status))}catch(e){append(false,'App-Icon '+size+'px: nicht erreichbar')}
   }
  }
 }catch(e){append(false,'Manifest fehlt oder ungültig: '+e.message)}
 if('serviceWorker' in navigator){
  try{const reg=await navigator.serviceWorker.getRegistration('./');
   append(Boolean(reg?.active),'Service Worker: '+(reg?.active?'aktiv':'nicht aktiv'));
   append(Boolean(navigator.serviceWorker.controller),'Offline-Steuerung: '+(navigator.serviceWorker.controller?'aktiv':'nach dem nächsten Neuladen aktiv'));
  }catch(e){append(false,'Service Worker: '+e.message)}
 }else{append(false,'Service Worker wird von diesem Browser nicht unterstützt')}
 append(supportsDirectInstall(),'Browser-Installationsfreigabe: '+(supportsDirectInstall()?'vorhanden':'noch nicht freigegeben'));
 if(root.isConnected)root.innerHTML=rows.join('')+'<div class="install-diagnostic-note">Falls eine technische Prüfung fehlschlägt, müssen die betreffenden Dateien im GitHub-Repository veröffentlicht sein. Ist nur die Browserfreigabe offen, kann sie nicht per JavaScript erzwungen werden.</div>';
}
async function installPWA(){
 if(isInstalledPWA()){toast('Fork Royale ist bereits installiert.');return}
 // No await before these calls: the browser needs the direct user click.
 if(typeof navigator.install==='function'){
  try{await navigator.install();toast('Fork Royale wurde installiert oder geöffnet.');}
  catch(e){showInstallHelp('Der Installationsdialog konnte nicht abgeschlossen werden: '+(e?.name||'Browserfehler'));}
  return;
 }
 if(deferredInstall){
  const p=deferredInstall;deferredInstall=null;
  try{await p.prompt();const choice=await p.userChoice;
   if(choice?.outcome==='accepted'){toast('Installation bestätigt.');}
   else if(choice?.outcome==='dismissed'){toast('Installation abgebrochen. Erneut versuchen, sobald Chrome die App wieder anbietet.');}
  }catch(e){showInstallHelp('Chrome konnte den Installationsdialog nicht öffnen: '+(e?.name||'Unbekannt'));}
  return;
 }
 showInstallHelp('Chrome hat noch keinen nativen Installationsdialog freigegeben.');
}

function food(id){return db.foods.find(f=>f.id===id)}
function assigned(){return new Set(db.plan.map(p=>p.foodId))}
function pool(){const planned=assigned(), chosen=new Set();for(const p of ['a','b']){db.ranks[p].filter(id=>food(id)&&!planned.has(id)).slice(0,db.prefs.topN).forEach(id=>chosen.add(id))}return [...chosen]}
function dropExpired(){let changed=false;for(const [id,out] of Object.entries(db.outAt||{})){if(Date.now()-out>=GRACE&&!assigned().has(id)){if(db.votes[id]){delete db.votes[id];changed=true}}}return changed}
function reconcile(previous=pool(),init=false){const next=pool(),prev=new Set(previous), now=new Set(next), planned=assigned();for(const id of previous){if(!now.has(id)&&!planned.has(id)&&!db.outAt[id])db.outAt[id]=Date.now()}
 for(const id of next){if(db.outAt[id]){if(Date.now()-db.outAt[id]>=GRACE)delete db.votes[id];delete db.outAt[id]}
 if(!prev.has(id)&&!init){for(const p of ['a','b'])if(!db.votes[id]?.[p]&&!db.priority[p].includes(id))db.priority[p].push(id)}}
 db.lastPool=next;dropExpired();for(const p of ['a','b']){db.priority[p]=db.priority[p].filter(id=>now.has(id)&&!db.votes[id]?.[p]);if(ui.hotCurrent[p]&&!now.has(ui.hotCurrent[p]))ui.hotCurrent[p]=null;if(ui.duel[p]&&(!food(ui.duel[p][0])||!food(ui.duel[p][1])||planned.has(ui.duel[p][0])||planned.has(ui.duel[p][1])))ui.duel[p]=null}
 store()}
if(!Array.isArray(db.lastPool)||db.lastPool.length===0)db.lastPool=pool();reconcile(db.lastPool,true);
function isMatched(id){if(assigned().has(id))return false;const eligible=pool().includes(id),grace=Number.isFinite(db.outAt[id])&&Date.now()-db.outAt[id]<GRACE;if(!eligible&&!grace)return false;const v=db.votes[id]||{};return v.a?.v==='super'||v.b?.v==='super'||(v.a?.v==='hot'&&v.b?.v==='hot')}
function matchedIds(){return db.foods.filter(f=>isMatched(f.id)).map(f=>f.id)}
function voteLabel(v){return ({hot:'Hot',not:'Not',super:'Super-Hot'})[v]||'Offen'}
function photo(f,cls=''){if(!f)return '';return `<div class="food-photo ${cls}" style="background:linear-gradient(145deg,#e8cfb8,#f8e6cd)"><span class="fallback">${esc(f.emoji||'🍽️')}</span>${f.image?`<img src="${esc(f.image)}" alt="${esc(f.name)}" loading="lazy" onerror="this.style.display='none'"/>`:''}</div>`}
function chips(f){return `<div class="tagline">${(f.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`}
function imgDay(iso){return fmt(iso,{day:'numeric',month:'short'})}
function currentWeek(){const base=monday(localDate());return shiftDate(base,ui.weekOffset*7)}
function dateInWeek(iso){const diff=Math.round((fromISO(monday(iso))-fromISO(monday(localDate())))/DAY);ui.weekOffset=Math.round(diff/7)}
function random(arr){return arr[Math.floor(Math.random()*arr.length)]}
function shuffled(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pickDuel(p){const available=new Set(db.foods.filter(f=>!assigned().has(f.id)).map(f=>f.id)),rank=db.ranks[p],pairs=[];for(let lower=1;lower<rank.length;lower++){if(!available.has(rank[lower]))continue;for(let upper=Math.max(0,lower-db.prefs.radius);upper<lower;upper++)if(available.has(rank[upper]))pairs.push([rank[lower],rank[upper]])}ui.duel[p]=random(pairs)||null}
function battle(winnerId){const p=db.active,d=ui.duel[p];if(!d||!d.includes(winnerId))return;const ranks=db.ranks[p],lower=ranks.indexOf(d[0]),upper=ranks.indexOf(d[1]);const prev=pool();if(winnerId===d[0]){const [id]=ranks.splice(lower,1);ranks.splice(upper,0,id)}db.duels[p]=(db.duels[p]||0)+1;ui.duel[p]=null;reconcile(prev);pickDuel(p);render();toast(winnerId===d[0]?`${food(winnerId).name} steigt in deiner Rangliste auf!`:'Der Verteidiger behält seinen Rang.')}
function pickHot(p){const eligible=pool(),pref=db.priority[p];while(pref.length){const id=pref.shift();if(eligible.includes(id)&&!db.votes[id]?.[p]){ui.hotCurrent[p]=id;return}}if(!eligible.length){ui.hotCurrent[p]=null;return}ui.hotBag[p]=ui.hotBag[p].filter(id=>eligible.includes(id));if(!ui.hotBag[p].length){const unvoted=eligible.filter(id=>!db.votes[id]?.[p]),rated=eligible.filter(id=>db.votes[id]?.[p]);ui.hotBag[p]=[...shuffled(unvoted),...shuffled(rated)]};if(ui.hotBag[p].length>1&&ui.hotBag[p][0]===ui.hotLast[p])ui.hotBag[p].push(ui.hotBag[p].shift());ui.hotCurrent[p]=ui.hotBag[p].shift()}
function doVote(value){const p=db.active,id=ui.hotCurrent[p];if(!id||!pool().includes(id))return;
 const before=isMatched(id),previous=db.votes[id]?.[p]?.v;
 db.votes[id]??={};db.votes[id][p]={v:value,at:Date.now()};
 // Queue one Super-Hot encounter for the other profile. Only that card may reveal it.
 if(value==='super'&&previous!=='super'){
  const other=p==='a'?'b':'a';
  db.notifications[other]=db.notifications[other].filter(n=>!(n.type==='super'&&n.foodId===id&&n.from===p));
  db.notifications[other].push({type:'super',from:p,foodId:id,foodName:food(id).name,at:Date.now()});
 }else if(previous==='super'&&value!=='super'){
  const other=p==='a'?'b':'a';
  db.notifications[other]=db.notifications[other].filter(n=>!(n.type==='super'&&n.foodId===id&&n.from===p));
 }
 ui.hotLast[p]=id;ui.hotCurrent[p]=null;reconcile(pool());pickHot(p);
 // Match takes precedence. After dismissal the next card can reveal pending Super-Hots.
 render(false);
 if(value==='hot'&&!before&&isMatched(id))showCelebration('match',{foodName:food(id).name});
 else {deliverNotificationsForCard();toast(value==='super'?'Super-Hot! Das Essen ist in der Matchliste.':'Bewertung gespeichert.');}
}
function closeCelebration(){document.getElementById('celebration-root').innerHTML=''}
function showCelebration(type,details={}){
 closeCelebration();
 const isSuper=type==='super',dish=esc(details.foodName||'Euer Essen'),who=esc(details.fromName||'Die andere Person');
 const flames=Array.from({length:isSuper?34:20},(_,i)=>{const x=(i*37+12)%101,size=55+(i*47)%125,delay=-((i*17)%21)/10,duration=1.6+(i%7)*.22;return `<i class="flame-tongue" style="--x:${x}%;--size:${size}px;--delay:${delay}s;--duration:${duration}s"></i>`}).join('');
 const sparks=Array.from({length:54},(_,i)=>{const x=(i*71+13)%101,y=(i*43+7)%101,delay=-((i*19)%27)/10;return `<i class="fire-spark" style="--x:${x}%;--y:${y}%;--delay:${delay}s;--duration:${1+(i%5)*.28}s"></i>`}).join('');
 const heart=`<div class="blazing-heart" aria-hidden="true"><span>♥</span></div>`;
 const center=isSuper?`<div class="super-burst" aria-hidden="true">🔥</div><p class="celebration-kicker">ALARM · SUPER-HOT</p><h2 class="celebration-title super-title">${who}<span>IST ON FIRE!</span></h2><p class="celebration-detail">${who} hat ein Super-Hot vergeben für</p><div class="celebration-food">${dish}</div>`:`${heart}<p class="celebration-kicker">ZWEI HERZEN · EIN GERICHT</p><h2 class="celebration-title match-title">IT'S A MATCH!</h2><div class="celebration-food">${dish}</div>`;
 const root=document.getElementById('celebration-root');
 root.innerHTML=`<button type="button" class="celebration celebration-${type}" data-action="closecelebration" aria-label="Animation schließen" role="alert"><div class="fire-radiance" aria-hidden="true"></div><div class="fire-field" aria-hidden="true">${flames}${sparks}</div><div class="celebration-center">${center}</div><div class="celebration-dismiss">Tippen zum Schließen · ✕</div></button>`;
 root.querySelector('.celebration')?.focus({preventScroll:true});
 // No auto-dismissal: the animation keeps looping until the person taps it (or presses Escape).
}
function deliverNotificationsForCard(){
 // Super-Hot is a surprise tied to *seeing* the dish in Hot or Not, not to login/profile changes.
 if(ui.tab!=='hot'||document.querySelector('#celebration-root .celebration'))return;
 const p=db.active,id=ui.hotCurrent[p];if(!id||!pool().includes(id))return;
 const before=db.notifications[p]||[];
 // Do not show stale surprises after withdrawal, deletion or planning.
 const queue=before.filter(n=>n.type==='super'&&n.from!==p&&food(n.foodId)&&!assigned().has(n.foodId)&&db.votes[n.foodId]?.[n.from]?.v==='super');
 const i=queue.findIndex(n=>n.foodId===id);
 const notice=i<0?null:queue.splice(i,1)[0];
 if(notice||queue.length!==before.length){db.notifications[p]=queue;store()}
 if(notice)showCelebration('super',{fromName:db.names[notice.from]||'Die andere Person',foodName:food(notice.foodId)?.name||notice.foodName||'ein Gericht'});
}

function toast(msg){const root=document.querySelector('#toast-root');root.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>root.innerHTML='',2900)}
function header(){return `<div class="topbar"><div class="topline"><span class="tag orange">${CLOUD_ON?"● GEMEINSAM":"● LOKALE DEMO"}</span><span class="version-chip">PWA · v${VERSION}</span></div><div class="top-controls"><div class="profile"><span class="avatar ${db.active==='b'?'other':''}">${db.active==='a'?'1':'2'}</span>${CLOUD_ON?`<span class="profile-name">${esc(db.names[db.active]||'Benutzer')}</span>`:`<select id="profile-select" aria-label="Aktives Profil"><option value="a" ${db.active==='a'?'selected':''}>${esc(db.names.a)}</option><option value="b" ${db.active==='b'?'selected':''}>${esc(db.names.b)}</option></select>`}</div><button class="install-btn" data-action="install" aria-label="Fork Royale installieren oder Installationsanleitung öffnen">⬇ Installieren</button></div></div>`}
const nav=[['arena','Arena'],['hot','Hot or Not'],['matches','Matchliste'],['week','Wochenplan'],['foods','Essenssammlung'],['history','Historie'],['settings','Einstellungen']];

function mobileNav(){const entries=[['arena','Arena'],['hot','Hot'],['matches','Matches'],['week','Plan']];return `<div class="mobile-nav">${entries.map(([k,l])=>`<button data-nav="${k}" class="${ui.tab===k?'active':''}"><span>${icons[k]}</span>${l}</button>`).join('')}<button data-action="more" class="${['foods','history','settings'].includes(ui.tab)?'active':''}"><span>☷</span>Mehr</button></div>${ui.more?`<div class="mobile-more">${nav.slice(4).map(([k,l])=>`<button data-nav="${k}">${icons[k]} &nbsp; ${l}</button>`).join('')}</div>`:''}`}
function welcome(title,subtitle,eyebrow='FORK ROYALE'){return `<div class="greeting"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${subtitle?`<p class="lead">${subtitle}</p>`:''}</div></div>`}
function stat(label,num,detail){return `<div class="stat"><div class="label">${label}</div><div class="num">${num}</div><div class="detail">${detail}</div></div>`}
function arena(){const p=db.active,ranks=db.ranks[p],N=ranks.length;let d=ui.duel[p];if(!d){pickDuel(p);d=ui.duel[p]}const rankHtml=ranks.map((id,i)=>{const f=food(id);if(!f)return '';return `<div class="rank-row"><span class="ranknum ${i<3?'podium':''}">${i+1}</span>${photo(f)}<strong>${esc(f.name)}</strong>${assigned().has(id)?'<span class="tag">Geplant</span>':''}</div>`}).join('');return welcome('Die Arena wartet.','Fordere zufällig höher platzierte Gerichte heraus. Deine Rangliste verändert sich mit jedem Kampf.','MODUS 01 · BOXARENA')+`<div class="stats">${stat('Deine Kämpfe',db.duels[p],`${esc(db.names[p])} · unabhängig`)}${stat('Gerichte',N,'Zwei persönliche Listen')}${stat('Reichweite',`+${db.prefs.radius}`,'Maximal höherer Rang')}${stat('Offene Matches',matchedIds().length,'Gemeinsam verfügbar')}</div><div class="twocol"><section class="surface fight"><div class="sectionhead"><div><h2>Neue Herausforderung</h2><p>Unbegrenzte Duelle · immer zufällig</p></div><span class="tag dark">LIVE-DUELL</span></div>${d?`<div class="fighter-grid">${fighter(d[0],p,'Herausforderer')}<div class="vs">VS</div>${fighter(d[1],p,'Verteidiger')}</div><p style="text-align:center;color:#d1ddd3;font-size:13px">Wer sollte in deiner Rangliste weiter oben stehen?</p><div class="vote-fight"><button data-battle="${d[0]}">🥊 ${esc(food(d[0]).name)} gewinnt</button><button data-battle="${d[1]}">🏆 ${esc(food(d[1]).name)} gewinnt</button></div><div class="fight-foot"><span>Bei Sieg des Herausforderers: Aufstieg zum Platz des Gegners.</span><button data-action="skipduel">↻ Andere</button></div>`:`<div class="empty" style="min-height:285px;color:#d7e3d7">Keine möglichen Duelle. Füge weitere Essen hinzu.</div>`}</section><section class="surface pad"><div class="sectionhead"><div><h2>Deine Boxrangliste</h2><p>${esc(db.names[p])} · alle ${ranks.length} Plätze</p></div><span class="tag orange">TOP ${db.prefs.topN}</span></div><div class="ranklist">${rankHtml}</div></section></div>`}
function fighter(id,p,tag){const f=food(id);return `<div class="fighter">${photo(f)}<span class="tag dark">${tag}</span><h3>${esc(f.name)}</h3><div class="rank">Platz ${db.ranks[p].indexOf(id)+1}</div></div>`}
function hot(){const p=db.active;if(!ui.hotCurrent[p]||!pool().includes(ui.hotCurrent[p]))pickHot(p);const id=ui.hotCurrent[p],f=food(id);
 return welcome('Worauf hast du Lust?','','MODUS 02 · HOT OR NOT')+`<div class="hot-layout"><div class="surface hot-card">${f?`${photo(f)}<div class="hot-content"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="tag green">↻ Endlos</span><span class="tag">Platz ${db.ranks[p].indexOf(id)+1}</span></div><div class="hot-name" style="margin-top:13px">${esc(f.name)}</div>${chips(f)}${db.votes[id]?.[p]?`<p class="helper">Letzte Stimme: <strong>${voteLabel(db.votes[id][p].v)}</strong></p>`:''}<div class="hot-buttons"><button class="vote-btn not" data-vote="not"><span>✕</span>Not</button><button class="vote-btn hot" data-vote="hot"><span>♥</span>Hot</button><button class="vote-btn super" data-vote="super"><span>🔥</span>Super-Hot</button></div></div>`:`<div class="empty"><strong>Keine Gerichte verfügbar</strong></div>`}</div></div>`
}
function matches(){const ids=matchedIds();return welcome('Eure gemeinsamen Matches.','Hier landen Gerichte mit zwei Hot-Stimmen oder mindestens einem Super-Hot. Nur Matches können in den Wochenplan.','GEMEINSAME ENTSCHEIDUNGEN')+`<div class="sectionhead"><div><h2>${ids.length} ${ids.length===1?'Gericht':'Gerichte'} auf eurer Liste</h2><p>Kein festes Datum – bis ihr euch für einen Tag entscheidet.</p></div><span class="tag green">Automatisch synchronisierbar</span></div>${ids.length?`<div class="match-grid">${ids.map(id=>{const f=food(id),superhot=db.votes[id]?.a?.v==='super'||db.votes[id]?.b?.v==='super',grace=db.outAt[id]&&!pool().includes(id);return `<div class="surface foodtile">${photo(f)}<div class="tilebody"><div class="tile-title">${esc(f.name)}</div><span class="tag ${superhot?'orange':'green'}">${superhot?'🔥 Super-Hot':'♥ Hot + Hot'}</span>${grace?` <span class="tag">10-Tage-Schutz</span>`:''}<div class="tile-footer"><span class="muted-sm">${esc(f.tags.slice(0,2).join(' · '))}</span><button class="btn primary mini" data-plan="${id}">Einplanen ↗</button></div></div></div>`}).join('')}</div>`:`<div class="empty"><span style="font-size:38px">♡</span><strong>Noch keine Matches</strong><p>Stimmt beide mit Hot ab oder setzt einmal Super-Hot.</p><button class="btn primary" data-nav="hot">Zu Hot or Not</button></div>`}`}
function week(){return welcome('Euer Wochenplan.','','WOCHENPLAN')+`<section class="surface pad"><div class="sectionhead"><h2>Montag bis Sonntag</h2><span class="tag orange">${db.plan.length} ${db.plan.length===1?'Gericht':'Gerichte'}</span></div><div class="week-cards">${WEEK_DAYS.map((day,i)=>{const entries=db.plan.filter(p=>p.day===i);return `<div class="daybox"><div class="dayname">${day}</div>${entries.map(entry=>{const f=food(entry.foodId);if(!f)return '';return `<div class="meal-chip">${esc(f.emoji)} ${esc(f.name)}<div class="smallactions"><button data-eat="${entry.id}" title="Als gegessen markieren">✓ Gegessen</button><button data-remove="${entry.id}" title="Aus dem Wochenplan entfernen">✕ Entfernen</button></div></div>`}).join('')}<button class="addday" data-plan-day="${i}">+ Essen</button></div>`}).join('')}</div></section>`}
function foods(){let list=db.foods.filter(f=>f.name.toLocaleLowerCase('de').includes(ui.search.toLocaleLowerCase('de'))&&(ui.tag==='Alle'||f.tags.includes(ui.tag)));const tags=['Alle',...new Set(db.foods.flatMap(f=>f.tags))].sort((a,b)=>a==='Alle'?-1:b==='Alle'?1:a.localeCompare(b,'de'));return welcome('Eure Essenssammlung.','Alle Gerichte mit Foto, Tags und zwei getrennten Ranglisten. Neue Essen starten auf dem letzten Platz.','DIE GEMEINSAME SAMMLUNG')+`<div class="listbar"><div class="searchwrap"><input id="search-food" class="input" placeholder="Gericht suchen …" value="${esc(ui.search)}"/></div><select id="tag-filter" class="input" style="width:auto;max-width:185px"><option value="Alle">Alle Tags</option>${tags.filter(t=>t!=='Alle').map(t=>`<option value="${esc(t)}" ${ui.tag===t?'selected':''}>${esc(t)}</option>`).join('')}</select><button class="btn primary" data-action="addfood">＋ Essen hinzufügen</button></div><div class="muted-sm" style="margin-bottom:15px">${list.length} von ${db.foods.length} Gerichten</div><div class="food-grid">${list.map(f=>{const planned=assigned().has(f.id),match=isMatched(f.id);return `<div class="surface foodtile">${photo(f)}<div class="tilebody"><div class="tile-title">${esc(f.name)}</div>${chips(f)}<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:11px"><span class="tag">#${db.ranks.a.indexOf(f.id)+1} ${esc(db.names.a)}</span><span class="tag">#${db.ranks.b.indexOf(f.id)+1} ${esc(db.names.b)}</span></div><div class="tile-footer"><span class="tag ${planned?'':match?'green':''}">${planned?'Im Plan':match?'Match':'Verfügbar'}</span><button class="btn ghost mini" data-edit="${f.id}">Bearbeiten</button></div></div></div>`}).join('')}</div>${!list.length?'<div class="empty">Keine passenden Gerichte gefunden.</div>':''}`}
function history(){const q=ui.historySearch.toLocaleLowerCase('de'),entries=[...db.history].filter(x=>x.name.toLocaleLowerCase('de').includes(q)).sort((a,b)=>b.date.localeCompare(a.date));const all=db.history,counts={};all.forEach(h=>counts[h.name]=(counts[h.name]||0)+1);const favorite=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];return welcome('Was gab es wann?','Alle als gegessen markierten Gerichte bleiben mit Datum dauerhaft in der Historie erhalten.','RÜCKBLICK & HISTORIE')+`<div class="stats" style="grid-template-columns:repeat(2,minmax(0,1fr));max-width:650px">${stat('Gegessene Mahlzeiten',all.length,'Ein Eintrag je Essensvorgang')}${stat('Am häufigsten',favorite?esc(favorite[0]):'–',favorite?`${favorite[1]} × gegessen`:'Noch keine Einträge')}</div><section class="surface pad"><div class="sectionhead"><div><h2>Alle Einträge</h2><p>Neueste zuerst · Datum kann auch nachträglich eingetragen werden.</p></div><input id="search-history" class="input" placeholder="Suche …" value="${esc(ui.historySearch)}" style="max-width:185px"/></div>${entries.length?entries.map(e=>{const f={name:e.name,emoji:e.emoji||'🍽️',image:e.image||food(e.foodId)?.image||''};return `<div class="history-row">${photo(f)}<div><strong>${esc(e.name)}</strong><p>${esc((e.tags||[]).join(' · '))}</p></div><span class="history-date">${fmt(e.date)}</span></div>`}).join(''):`<div class="empty"><strong>Keine passenden Einträge</strong></div>`}</section>`}
function settings(){return welcome('Alles nach eurem Geschmack.','Gemeinsame Regeln für beide Geräte und persönliche Profilnamen. Änderungen wirken sich auf den Kandidatenpool aus.','KONFIGURATION')+`<div class="settings-grid"><section class="setting-block"><div class="sectionhead"><h2>Hot-or-Not-Topliste</h2><span class="tag orange">Top ${db.prefs.topN}</span></div><p>Jede Person stellt ihre obersten ${db.prefs.topN} verfügbaren Essen bereit. Die gemeinsame Auswahl enthält alle unterschiedlichen Kandidaten.</p><div class="field"><label for="top-n">Gemeinsamer Top-N-Wert</label><input id="top-n" type="range" min="1" max="${Math.max(1,db.foods.length)}" value="${db.prefs.topN}"/><div style="display:flex;justify-content:space-between;font-size:12px;color:#788177"><span>Top 1</span><strong>${db.prefs.topN}</strong><span>Top ${Math.max(1,db.foods.length)}</span></div></div></section><section class="setting-block"><h2>Boxarena</h2><p>Jeder Kampf findet zwischen zwei unterschiedlich platzierten Essen statt. Der niedrigere Rang fordert maximal zehn Plätze nach oben heraus.</p><div class="mini-stats"><span class="tag">Maximal 10 Plätze</span><span class="tag green">Unbegrenzt kämpfen</span></div><div class="hr"></div><p>Aufstieg nach Sieg: Der Herausforderer übernimmt den Rang des Verteidigers.</p></section><section class="setting-block"><h2>Eure Profile</h2><div class="field"><label for="name-a">Person 1</label><input id="name-a" class="input" maxlength="28" value="${esc(db.names.a)}"/></div><div class="field"><label for="name-b">Person 2</label><input id="name-b" class="input" maxlength="28" value="${esc(db.names.b)}"/></div><button class="btn ghost" style="margin-top:12px" data-action="savenames">Namen speichern</button></section><section class="setting-block"><h2>Aufbewahrung & Historie</h2><div class="mini-stats"><span class="tag green">10 Tage Bestandsschutz</span><span class="tag">Ränge bleiben erhalten</span></div><p>Wenn ein Gericht aus beiden Toplisten fällt, bleiben bestehende Stimmen und Matches 10 Tage erhalten. Als gegessen markierte Gerichte verlieren ihre Stimmen, nicht ihre Ränge.</p></section><section class="setting-block"><h2>Animationen</h2><p>Beide Effekte bleiben sichtbar, bis du darauf tippst. Der Super-Hot-Alarm erscheint beim anderen Profil erst auf der betroffenen Hot-or-Not-Karte.</p><div class="mini-stats" style="margin-top:12px"><button class="btn primary mini" data-action="previewmatch">♥ Match testen</button><button class="btn dark mini" data-action="previewsuper">🔥 Super-Hot testen</button></div></section><section class="setting-block"><h2>Installation & Version</h2><div class="mini-stats"><span class="tag orange">PWA v${VERSION}</span><span class="tag">HTML · CSS · JavaScript</span></div><p>Der Button ruft den echten Browser-Installationsdialog auf, sobald Chrome ihn zulässt. Bei Problemen zeigt er eine technische Prüfung.</p><button class="btn primary" style="margin-top:12px" data-action="install">⬇ App installieren</button></section><section class="setting-block"><h2>${CLOUD_ON?'Gemeinsames Konto':'Lokale Demo'}</h2><p>${CLOUD_ON?'Daten werden zwischen euren beiden eigenen Konten über Firebase synchronisiert. Die Namen und der Top-N-Wert sind gemeinsam.':'Ohne Firebase-Konfiguration läuft die App lokal auf diesem Gerät. Du kannst beide Demoprofile ausprobieren; zwischen zwei Smartphones wird noch nichts synchronisiert.'}</p>${CLOUD_ON?`<button class="btn ghost" style="margin-top:12px" data-action="signout">Abmelden</button>`:`<button class="btn danger" style="margin-top:12px" data-action="reset">Lokale Demo zurücksetzen</button>`}</section></div>`}
function render(showCardAlerts=true){const root=document.getElementById('app');const sections={arena,hot,matches,week,foods,history,settings};const body=sections[ui.tab]();root.innerHTML=`<div class="app">${sidebar()}<main class="main"><div class="shell">${header()}${body}<div class="footer-note">Fork Royale · PWA v${VERSION} · ${CLOUD_ON?'Firebase · Zwei Konten':'Lokale Demo · Noch nicht synchronisiert'}</div></div></main>${mobileNav()}</div>`;renderModal();if(showCardAlerts)deliverNotificationsForCard()}
function modalFrame(title,body,buttons=''){return `<div class="overlay" data-overlay="true"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h2>${title}</h2><button class="modal-close" data-action="closemodal" aria-label="Schließen">×</button></div>${body}${buttons?`<div class="modal-actions">${buttons}</div>`:''}</div></div>`}
function renderModal(){const root=document.getElementById('modal-root'),m=ui.modal;if(!m){root.innerHTML='';return}
 if(m.type==='plan'){
  const f=food(m.foodId),day=Number.isInteger(m.day)?m.day:0;
  const dayPicker=`<div class="field"><label for="plan-day">Wochentag</label><select class="input" id="plan-day">${WEEK_DAYS.map((d,i)=>`<option value="${i}" ${day===i?'selected':''}>${d}</option>`).join('')}</select></div>`;
  const matchesList=matchedIds();
  if(f){root.innerHTML=modalFrame('Essen einplanen',`<div style="display:flex;gap:15px;align-items:center;margin-top:19px">${photo(f)}<div><h3>${esc(f.name)}</h3><p class="muted-sm">${esc(WEEK_DAYS[day])}</p></div></div>${dayPicker}`,`<button class="btn ghost" data-action="closemodal">Abbrechen</button><button class="btn primary" data-action="confirmplan">Zum Wochenplan hinzufügen</button>`)}
  else{root.innerHTML=modalFrame('Match auswählen',`${dayPicker}${matchesList.length?matchesList.map(id=>`<div class="modal-match-row">${photo(food(id))}<div style="flex:1;font-weight:750">${esc(food(id).name)}</div><button class="btn primary mini" data-choosematch="${id}">Auswählen</button></div>`).join(''):`<div class="empty"><strong>Keine Matches vorhanden</strong><button class="btn primary" data-nav="hot">Zu Hot or Not</button></div>`}`,`<button class="btn ghost" data-action="closemodal">Schließen</button>`)}
 }else if(m.type==='eat'){
  const entry=db.plan.find(p=>p.id===m.id);if(!entry){ui.modal=null;renderModal();return}const f=food(entry.foodId);
  root.innerHTML=modalFrame('Als gegessen markieren',`<div style="display:flex;gap:15px;align-items:center;margin-top:18px">${photo(f)}<div><h3>${esc(f.name)}</h3><p class="muted-sm">Geplant für ${WEEK_DAYS[entry.day]}</p></div></div><div class="field"><label for="eaten-date">Wann habt ihr das Essen gegessen?</label><input id="eaten-date" class="input" type="date" value="${localDate()}" required/></div>`,`<button class="btn ghost" data-action="closemodal">Abbrechen</button><button class="btn green" data-action="confirmeat">✓ Als gegessen speichern</button>`)
 }else if(m.type==='food'){
  const f=m.id?food(m.id):null;
  root.innerHTML=modalFrame(f?'Gericht bearbeiten':'Neues Essen hinzufügen',`<div class="field"><label for="food-name">Name des Gerichts *</label><input id="food-name" class="input" maxlength="70" placeholder="z. B. Pasta mit Pesto" value="${esc(f?.name||'')}" required/></div><div class="field"><label for="food-tags">Tags (durch Komma getrennt)</label><input id="food-tags" class="input" placeholder="Pasta, Vegetarisch, Schnell" value="${esc((f?.tags||[]).join(', '))}"/></div><div class="field"><label for="food-emoji">Symbol</label><input id="food-emoji" class="input" maxlength="8" placeholder="🍽️" value="${esc(f?.emoji||'🍽️')}"/></div><div class="field photo-upload"><label for="food-image">Foto vom Gerät auswählen</label><input id="food-image" class="input" type="file" accept="image/*"/><span class="field-hint">${CLOUD_ON?'Das Foto wird verkleinert und in Firebase Storage hochgeladen.':'Das Bild wird lokal verkleinert und gespeichert.'}</span>${f?.image?`<div style="display:flex;gap:9px;align-items:center;margin-top:10px">${photo(f)}<span class="muted-sm">Aktuelles Bild</span></div>`:''}</div>`,`<button class="btn ghost" data-action="closemodal">Abbrechen</button>${f?`<button class="btn danger" data-action="deletefood" style="margin-right:auto">Löschen</button>`:''}<button class="btn primary" data-action="savefood">Speichern</button>`)
 }else if(m.type==='install'){
  root.innerHTML=modalFrame('Fork Royale installieren',`<div class="install-instructions">${m.reason?`<div class="install-hint">${esc(m.reason)}</div>`:''}${installInstructions()}<div class="install-diagnostics" id="install-diagnostics">PWA-Voraussetzungen werden geprüft …</div></div>`,`<button class="btn ghost" data-action="recheckinstall">Erneut prüfen</button><button class="btn primary" data-action="closemodal">Schließen</button>`)
 }else if(m.type==='reset'){
  root.innerHTML=modalFrame('Demo wirklich zurücksetzen?',`<p class="secondary-copy">Alle lokal geänderten Gerichte, Kämpfe, Bewertungen, Wochenpläne und Historieneinträge werden durch die ursprünglichen Beispieldaten ersetzt.</p>`,`<button class="btn ghost" data-action="closemodal">Abbrechen</button><button class="btn danger" data-action="confirmreset">Zurücksetzen</button>`)
 }
}
function openPlan(foodId,day){ui.modal={type:'plan',foodId,day:Number.isInteger(day)?day:0};renderModal()}
function assignFromModal(){const id=ui.modal?.foodId,day=Number(document.querySelector('#plan-day')?.value);if(!id||!Number.isInteger(day)||day<0||day>6||!isMatched(id)){toast('Das Gericht muss ein gültiges Match sein.');return}const prev=pool();db.plan.push({id:uid(),foodId:id,day});for(const p of ['a','b'])db.notifications[p]=db.notifications[p].filter(n=>n.foodId!==id);ui.modal=null;reconcile(prev);ui.tab='week';render();toast(`${food(id).name} für ${WEEK_DAYS[day]} eingeplant.`)}
function removePlan(id){const idx=db.plan.findIndex(e=>e.id===id);if(idx<0)return;const prev=pool(),entry=db.plan[idx];db.plan.splice(idx,1);reconcile(prev);render();toast(`${food(entry.foodId)?.name} ist wieder verfügbar.`)}
function confirmEaten(){const entry=db.plan.find(p=>p.id===ui.modal?.id),date=document.getElementById('eaten-date')?.value;if(!entry||!date){toast('Bitte ein gültiges Datum angeben.');return}const f=food(entry.foodId),prev=pool();db.history.push({id:uid(),foodId:f.id,name:f.name,tags:[...f.tags],emoji:f.emoji,image:f.image||'',date});db.plan=db.plan.filter(p=>p.id!==entry.id);delete db.votes[f.id];delete db.outAt[f.id];for(const p of ['a','b'])db.notifications[p]=db.notifications[p].filter(n=>n.foodId!==f.id);ui.modal=null;reconcile(prev);for(const p of ['a','b'])if(pool().includes(f.id)&&!db.priority[p].includes(f.id))db.priority[p].unshift(f.id);store();render();toast(`${f.name} am ${fmt(date)} als gegessen gespeichert.`)}
async function shrink(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return}const reader=new FileReader();reader.onerror=()=>reject(Error('Bildlesefehler'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('Ungültiges Bild'));img.onload=()=>{const canvas=document.createElement('canvas'),scale=Math.min(1,800/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}
async function saveFood(){const name=document.getElementById('food-name')?.value.trim(),tags=document.getElementById('food-tags')?.value.split(',').map(t=>t.trim()).filter(Boolean),emoji=document.getElementById('food-emoji')?.value.trim()||'🍽️',file=document.getElementById('food-image')?.files?.[0];if(!name){toast('Bitte einen Namen eingeben.');document.getElementById('food-name')?.focus();return}let image=null;try{image=await shrink(file)}catch(e){toast('Das Bild konnte nicht verarbeitet werden.');return}const existing=ui.modal?.id?food(ui.modal.id):null,chosenId=existing?.id||'u'+uid();
 if(image&&CLOUD_ON){try{image=await cloud.uploadImage(chosenId,image)}catch(err){toast('Bild-Upload fehlgeschlagen: '+err.message);return}}
 const prev=pool(),f=existing;if(f){f.name=name;f.tags=tags;f.emoji=emoji;if(image)f.image=image}else{const id=chosenId;db.foods.push({id,name,tags,emoji,image:image||'',createdAt:Date.now()});db.ranks.a.push(id);db.ranks.b.push(id)}ui.modal=null;reconcile(prev);render();toast(f?'Gericht aktualisiert.':'Neues Gericht hinzugefügt. Es startet unten in beiden Ranglisten.')}
function deleteFood(){const id=ui.modal?.id,f=food(id);if(!f)return;if(!confirm(`„${f.name}“ wirklich löschen? Historieneinträge bleiben erhalten.`))return;const prev=pool();db.foods=db.foods.filter(x=>x.id!==id);db.ranks.a=db.ranks.a.filter(x=>x!==id);db.ranks.b=db.ranks.b.filter(x=>x!==id);db.plan=db.plan.filter(x=>x.foodId!==id);delete db.votes[id];delete db.outAt[id];for(const p of ['a','b'])db.notifications[p]=db.notifications[p].filter(n=>n.foodId!==id);db.priority.a=db.priority.a.filter(x=>x!==id);db.priority.b=db.priority.b.filter(x=>x!==id);ui.modal=null;reconcile(prev);render();toast('Gericht gelöscht. Historie bleibt bestehen.')}
function setTop(v){const n=Math.max(1,Math.min(db.foods.length,Number(v)||1)),prev=pool();db.prefs.topN=n;reconcile(prev);render();toast(`Die gemeinsame Top-Grenze ist jetzt ${n}.`)}
function navigate(tab){ui.tab=tab;ui.more=false;ui.modal=null;render();window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const navTarget=e.target.closest('[data-nav]');if(navTarget){navigate(navTarget.dataset.nav);return}const el=e.target.closest('[data-action],[data-battle],[data-vote],[data-plan],[data-plan-day],[data-choosematch],[data-eat],[data-remove],[data-edit]');if(!el){if(e.target.matches('[data-overlay]')){ui.modal=null;renderModal()}return}if(el.dataset.battle){battle(el.dataset.battle);return}if(el.dataset.vote){doVote(el.dataset.vote);return}if(el.dataset.plan!==undefined){openPlan(el.dataset.plan);return}if(el.dataset.planDay!==undefined){openPlan(null,Number(el.dataset.planDay));return}if(el.dataset.choosematch){const day=Number(document.getElementById('plan-day')?.value);openPlan(el.dataset.choosematch,day);return}if(el.dataset.eat){ui.modal={type:'eat',id:el.dataset.eat};renderModal();return}if(el.dataset.remove){removePlan(el.dataset.remove);return}if(el.dataset.edit){ui.modal={type:'food',id:el.dataset.edit};renderModal();return}switch(el.dataset.action){case 'closecelebration':closeCelebration();deliverNotificationsForCard();break;case 'install':installPWA();break;case 'recheckinstall':void checkInstallRequirements();break;case 'signout':if(cloud)cloud.signOut().then(()=>{cloudReady=false;paintLogin('login')}).catch(e=>toast(e.message));break;case 'previewmatch':showCelebration('match',{foodName:'Pizza Margherita'});break;case 'previewsuper':showCelebration('super',{fromName:db.names[db.active==='a'?'b':'a'],foodName:'Cheeseburger'});break;case 'more':ui.more=!ui.more;render();break;case 'skipduel':pickDuel(db.active);render();break;case 'addfood':ui.modal={type:'food'};renderModal();break;case 'closemodal':ui.modal=null;renderModal();break;case 'confirmplan':assignFromModal();break;case 'confirmeat':confirmEaten();break;case 'savefood':saveFood();break;case 'deletefood':deleteFood();break;case 'reset':ui.modal={type:'reset'};renderModal();break;case 'confirmreset':if(CLOUD_ON){toast('Cloud-Daten können hier nicht zurückgesetzt werden.');return}db=seed();ui={...ui,tab:'arena',hotCurrent:{a:null,b:null},hotBag:{a:[],b:[]},hotLast:{a:null,b:null},duel:{a:null,b:null},modal:null,search:'',historySearch:'',tag:'Alle'};reconcile(pool(),true);render();toast('Demo wurde zurückgesetzt.');break;case 'savenames':db.names.a=document.getElementById('name-a')?.value.trim()||'Person 1';db.names.b=document.getElementById('name-b')?.value.trim()||'Person 2';store();render();toast('Profilnamen gespeichert.');break;}});
document.addEventListener('change',e=>{if(e.target.id==='profile-select'&&!CLOUD_ON){closeCelebration();db.active=e.target.value;store();render()}if(e.target.id==='tag-filter'){ui.tag=e.target.value;render()}if(e.target.id==='top-n')setTop(e.target.value)});
document.addEventListener('input',e=>{if(e.target.id==='search-food'){ui.search=e.target.value;const caret=e.target.selectionStart;render();const i=document.getElementById('search-food');i?.focus();i?.setSelectionRange(caret,caret)}if(e.target.id==='search-history'){ui.historySearch=e.target.value;const caret=e.target.selectionStart;render();const i=document.getElementById('search-history');i?.focus();i?.setSelectionRange(caret,caret)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('#celebration-root .celebration')){closeCelebration();return}if(ui.modal){ui.modal=null;renderModal()}}});
document.addEventListener('submit',async e=>{
 if(e.target?.id!=='login-form')return;e.preventDefault();
 if(!cloud)return;
 const email=document.getElementById('email')?.value.trim(),password=document.getElementById('password')?.value||'';
 paintLogin('loading');
 try{await cloud.signIn(email,password)}catch(err){paintLogin('error','Anmeldung fehlgeschlagen. Bitte E-Mail und Passwort prüfen.');}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;toast('Fork Royale wurde installiert.')});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(e=>console.error('Fork Royale: Service-Worker-Registrierung fehlgeschlagen',e)));
}
if(CLOUD_ON){
 paintLogin('loading');
 import('./firebase-adapter.js?v=1.0.4').then(m=>{
   cloud=m.connect(window.FORK_CONFIG,{
     emptyState,
     onUser:(role,email)=>{cloudRole=role},
     onStatus:status=>{if(status==='login')cloudReady=false;paintLogin(status)},
     onData:applyCloudState,
     onError:err=>{paintLogin('error','Firebase-Fehler: '+(err?.message||err));}
   });
 }).catch(err=>paintLogin('error','Firebase-Modul konnte nicht geladen werden: '+err.message));
}
render();
})();
</script>
</body></html>
